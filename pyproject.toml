[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "roadsegbench"
version = "2.0.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24","pandas>=2.0","scipy>=1.10","opencv-python-headless>=4.8","Pillow>=10.0","torch>=2.1","PyYAML>=6.0"]
[tool.setuptools.packages.find]
include = ["roadsegbench*"]
