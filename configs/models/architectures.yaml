# Model configurations used for the 240 benchmark runs, taken from the run.json of every run
# (records/run_configs_240runs.json). tools/run_staged_benchmark.py and tools/run_one_seed_pilot.py
# read these two groups. initial_lr is the AdamW learning rate (default 0.001).
primary_architectures:
  unet: {encoder: resnet34, encoder_weights: imagenet}
  deeplabv3plus: {encoder: resnet101, encoder_weights: imagenet}
  bisenetv2: {pretrained: true}
  ddrnet: {variant: ddrnet_23, boundary_refinement: false, pretrained: true}
  pidnet: {variant: pidnet-m, pretrained: true}
  segformer: {checkpoint: nvidia/mit-b2, initial_lr: 0.00006}
extended_architectures:
  sctnet: {variant: sctnet-b, pretrained: true}
  ddrnet_br: {variant: ddrnet_23, boundary_refinement: true, pretrained: true}
